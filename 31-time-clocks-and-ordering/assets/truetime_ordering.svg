<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Physical Clocks, Uncertainty &amp; TrueTime Commit Wait">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Physical Clocks, Uncertainty &amp; TrueTime Commit Wait</text>
  <text x="32" y="58" class="sub">Respecting bounded clock uncertainty epsilon instead of trusting wall-clock NTP</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="105" width="220" height="74" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="142.0" y="138.0" text-anchor="middle" class="box-t">NTP Public Network</text>
  <text x="142.0" y="156.0" text-anchor="middle" class="box-s">Unbounded drift (100ms - 250ms)</text>
  <rect x="300" y="105" width="270" height="74" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="435.0" y="138.0" text-anchor="middle" class="white-t">Google TrueTime Interval</text>
  <text x="435.0" y="156.0" text-anchor="middle" class="white-s">[earliest, latest] with 2*eps &lt;= 7ms</text>
  <rect x="618" y="105" width="250" height="74" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="743.0" y="138.0" text-anchor="middle" class="box-t">Logical Lamport / HLC</text>
  <text x="743.0" y="156.0" text-anchor="middle" class="box-s">Guarantees A -&gt; B =&gt; L(A) &lt; L(B)</text>
  <line x1="32" y1="235" x2="868" y2="235" stroke="#1d4ed8" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <text x="450" y="222" text-anchor="middle" class="lbl">Timeline: Commit Timestamp s picked at t_latest  ---&gt;  Wait until earliest &gt; s (Commit Wait)</text>
  <rect x="80" y="265" width="330" height="90" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="245.0" y="306.0" text-anchor="middle" class="box-t">Rule 1: Pick s &gt;= now().latest</text>
  <text x="245.0" y="324.0" text-anchor="middle" class="box-s">Lock held while uncertainty window clears</text>
  <rect x="480" y="265" width="340" height="90" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="650.0" y="306.0" text-anchor="middle" class="box-t">Rule 2: Release after now().earliest &gt; s</text>
  <text x="650.0" y="324.0" text-anchor="middle" class="box-s">Any future Tx2 sees s2 &gt; s1 physically everywhere</text>
</svg>