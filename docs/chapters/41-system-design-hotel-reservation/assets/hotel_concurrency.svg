<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Zero-Overbooking Reservation Concurrency Control">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Zero-Overbooking Reservation Concurrency Control</text>
  <text x="32" y="58" class="sub">Stopping race conditions on the last available room using optimistic versions &amp; temporary holds</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="100" width="230" height="84" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="147.0" y="138.0" text-anchor="middle" class="box-t">User A &amp; B Request Same Room</text>
  <text x="147.0" y="156.0" text-anchor="middle" class="box-s">Search shows 1 room left (Cache)</text>
  <line x1="262" y1="142" x2="315" y2="142" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="288.5" y="135.0" text-anchor="middle" class="lbl">Serialize</text>
  <rect x="315" y="100" width="260" height="84" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="445.0" y="138.0" text-anchor="middle" class="white-t">Inventory DB (version=7)</text>
  <text x="445.0" y="156.0" text-anchor="middle" class="white-s">UPDATE total_reserved = +1 WHERE version=7</text>
  <line x1="575" y1="142" x2="628" y2="142" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="601.5" y="135.0" text-anchor="middle" class="lbl">1 row wins</text>
  <rect x="628" y="100" width="240" height="84" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="748.0" y="138.0" text-anchor="middle" class="box-t">15-Min Hold -&gt; Payment</text>
  <text x="748.0" y="156.0" text-anchor="middle" class="box-s">Loser gets 409 Conflict cleanly</text>
  <rect x="32" y="235" width="400" height="105" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="232.0" y="283.5" text-anchor="middle" class="box-t">Handling Abandoned Checkouts</text>
  <text x="232.0" y="301.5" text-anchor="middle" class="box-s">Redis/DB hold expires automatically after 15m TTL if payment never completes</text>
  <rect x="460" y="235" width="408" height="105" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="664.0" y="283.5" text-anchor="middle" class="box-t">Idempotent Booking Confirmation</text>
  <text x="664.0" y="301.5" text-anchor="middle" class="box-s">Payment Idempotency-Key ensures retry after network drop never double-bills or reserves twice</text>
</svg>