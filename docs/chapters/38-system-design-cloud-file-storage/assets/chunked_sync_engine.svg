<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Block-Level Cloud File Sync &amp; Delta Deduplication">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Block-Level Cloud File Sync &amp; Delta Deduplication</text>
  <text x="32" y="58" class="sub">Uploading only modified 4MB content chunks instead of entire files</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="100" width="190" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="127.0" y="137.0" text-anchor="middle" class="box-t">Client Watcher</text>
  <text x="127.0" y="155.0" text-anchor="middle" class="box-s">Splits file into 4MB chunks</text>
  <line x1="222" y1="141" x2="268" y2="141" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="245.0" y="134.0" text-anchor="middle" class="lbl">SHA-256</text>
  <rect x="268" y="100" width="200" height="82" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="368.0" y="137.0" text-anchor="middle" class="white-t">Block Server</text>
  <text x="368.0" y="155.0" text-anchor="middle" class="white-s">Compresses &amp; dedups chunks</text>
  <line x1="468" y1="141" x2="514" y2="141" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="491.0" y="134.0" text-anchor="middle" class="lbl">Only delta</text>
  <rect x="514" y="100" width="165" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="596.5" y="137.0" text-anchor="middle" class="box-t">Cold Object Store</text>
  <text x="596.5" y="155.0" text-anchor="middle" class="box-s">S3 / Magic Pocket</text>
  <rect x="710" y="100" width="158" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="789.0" y="137.0" text-anchor="middle" class="box-t">Metadata SQL</text>
  <text x="789.0" y="155.0" text-anchor="middle" class="box-s">Files -&gt; Chunk IDs</text>
  <rect x="32" y="235" width="390" height="105" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="227.0" y="283.5" text-anchor="middle" class="box-t">Delta Sync Efficiency</text>
  <text x="227.0" y="301.5" text-anchor="middle" class="box-s">Editing 1KB inside a 1GB video syncs only one 4MB block (&lt;1% bandwidth)</text>
  <rect x="450" y="235" width="418" height="105" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="659.0" y="283.5" text-anchor="middle" class="box-t">Real-Time Notification Bus</text>
  <text x="659.0" y="301.5" text-anchor="middle" class="box-s">Long-poll / WebSocket pushes metadata diffs to other logged-in devices</text>
</svg>