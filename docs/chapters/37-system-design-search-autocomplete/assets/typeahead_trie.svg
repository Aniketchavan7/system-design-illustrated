<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Sub-50ms Search Autocomplete &amp; Trie Top-K Pipeline">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Sub-50ms Search Autocomplete &amp; Trie Top-K Pipeline</text>
  <text x="32" y="58" class="sub">Separating real-time prefix reads from background log aggregation &amp; trie snapshots</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="100" width="210" height="78" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="137.0" y="135.0" text-anchor="middle" class="box-t">Keystroke Request</text>
  <text x="137.0" y="153.0" text-anchor="middle" class="box-s">q=&#x27;sys&#x27; -&gt; Edge / LB (&lt;50ms)</text>
  <line x1="242" y1="139" x2="290" y2="139" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="266.0" y="132.0" text-anchor="middle" class="lbl">Read</text>
  <rect x="290" y="100" width="270" height="78" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="425.0" y="135.0" text-anchor="middle" class="white-t">In-Memory Sharded Trie</text>
  <text x="425.0" y="153.0" text-anchor="middle" class="white-s">Each node caches Top 10 O(K)</text>
  <line x1="560" y1="139" x2="610" y2="139" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="585.0" y="132.0" text-anchor="middle" class="lbl">Miss</text>
  <rect x="610" y="100" width="258" height="78" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="739.0" y="135.0" text-anchor="middle" class="box-t">Redis Prefix Cache</text>
  <text x="739.0" y="153.0" text-anchor="middle" class="box-s">Shard by first 1-2 chars (a-z)</text>
  <rect x="32" y="235" width="245" height="90" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="154.5" y="276.0" text-anchor="middle" class="box-t">Search Query Logs</text>
  <text x="154.5" y="294.0" text-anchor="middle" class="box-s">Clickstream -&gt; Kafka events</text>
  <line x1="277" y1="280" x2="325" y2="280" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="301.0" y="273.0" text-anchor="middle" class="lbl">Windowed</text>
  <rect x="325" y="235" width="255" height="90" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="452.5" y="276.0" text-anchor="middle" class="box-t">Aggregator + Decay Filter</text>
  <text x="452.5" y="294.0" text-anchor="middle" class="box-s">Top queries every 15m; block spam</text>
  <line x1="580" y1="280" x2="628" y2="280" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="604.0" y="273.0" text-anchor="middle" class="lbl">Atomic swap</text>
  <rect x="628" y="235" width="240" height="90" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="748.0" y="276.0" text-anchor="middle" class="box-t">Rebuild Trie Snapshot</text>
  <text x="748.0" y="294.0" text-anchor="middle" class="box-s">Zero-downtime blue/green push</text>
</svg>