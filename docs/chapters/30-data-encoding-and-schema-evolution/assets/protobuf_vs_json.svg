<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Schema Evolution: JSON vs. Protobuf Binary Wire Framing">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Schema Evolution: JSON vs. Protobuf Binary Wire Framing</text>
  <text x="32" y="58" class="sub">Replacing repeated UTF-8 field names with numeric field tags and varints</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="100" width="390" height="120" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="227.0" y="156.0" text-anchor="middle" class="box-t">JSON Text Frame (~58 Bytes)</text>
  <text x="227.0" y="174.0" text-anchor="middle" class="box-s">{&quot;user_name&quot;: &quot;Martin&quot;, &quot;favorite_number&quot;: 1337}</text>
  <line x1="422" y1="160" x2="478" y2="160" stroke="#1d4ed8" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <text x="450.0" y="153.0" text-anchor="middle" class="lbl">3x - 5x smaller</text>
  <rect x="478" y="100" width="390" height="120" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="673.0" y="156.0" text-anchor="middle" class="white-t">Protobuf Wire Frame (~18 Bytes)</text>
  <text x="673.0" y="174.0" text-anchor="middle" class="white-s">[Tag 1:len:Martin] [Tag 2:varint:1337]</text>
  <rect x="32" y="250" width="405" height="110" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="234.5" y="301.0" text-anchor="middle" class="box-t">Forward Compatibility</text>
  <text x="234.5" y="319.0" text-anchor="middle" class="box-s">Old reader safely skips unknown new field tags using wire type lengths</text>
  <rect x="463" y="250" width="405" height="110" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="665.5" y="301.0" text-anchor="middle" class="box-t">Backward Compatibility</text>
  <text x="665.5" y="319.0" text-anchor="middle" class="box-s">Never reuse tag numbers; append optional fields or mark reserved</text>
</svg>