<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Payment Execution, Reconciliation &amp; Double-Entry Ledger">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Payment Execution, Reconciliation &amp; Double-Entry Ledger</text>
  <text x="32" y="58" class="sub">Guaranteeing every cent balances to zero even across PSP retries and timeouts</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="100" width="185" height="80" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="124.5" y="136.0" text-anchor="middle" class="box-t">Checkout + Order</text>
  <text x="124.5" y="154.0" text-anchor="middle" class="box-s">UUID Idempotency-Key</text>
  <line x1="217" y1="140" x2="265" y2="140" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="241.0" y="133.0" text-anchor="middle" class="lbl">Authorize</text>
  <rect x="265" y="100" width="195" height="80" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="362.5" y="136.0" text-anchor="middle" class="white-t">Payment Executor</text>
  <text x="362.5" y="154.0" text-anchor="middle" class="white-s">Executes PSP API once</text>
  <line x1="460" y1="140" x2="508" y2="140" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="484.0" y="133.0" text-anchor="middle" class="lbl">Async Webhook</text>
  <rect x="508" y="100" width="175" height="80" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="595.5" y="136.0" text-anchor="middle" class="box-t">External PSP</text>
  <text x="595.5" y="154.0" text-anchor="middle" class="box-s">Stripe / Adyen / Visa</text>
  <line x1="683" y1="140" x2="725" y2="140" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="725" y="100" width="143" height="80" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="796.5" y="136.0" text-anchor="middle" class="box-t">Settlement File</text>
  <text x="796.5" y="154.0" text-anchor="middle" class="box-s">T+1 Reconcile</text>
  <rect x="32" y="230" width="836" height="115" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450.0" y="283.5" text-anchor="middle" class="box-t">Double-Entry Ledger Invariant:  Sum(Debits) + Sum(Credits) == 0  (Immutable Append-Only Rows)</text>
  <text x="450.0" y="301.5" text-anchor="middle" class="box-s">Buyer Account -$50.00 (Debit)   |   Seller Account +$48.50 (Credit)   |   Fee Account +$1.50 (Credit)</text>
</svg>