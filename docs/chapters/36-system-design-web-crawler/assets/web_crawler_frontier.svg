<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Distributed Web Crawler &amp; URL Frontier">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Distributed Web Crawler &amp; URL Frontier</text>
  <text x="32" y="58" class="sub">Enforcing per-domain politeness while downloading billions of pages cleanly</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="110" width="185" height="82" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="124.5" y="147.0" text-anchor="middle" class="white-t">URL Frontier</text>
  <text x="124.5" y="165.0" text-anchor="middle" class="white-s">Front: Priority | Back: Politeness</text>
  <line x1="217" y1="151" x2="260" y2="151" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="260" y="110" width="180" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="350.0" y="147.0" text-anchor="middle" class="box-t">DNS Cache + Fetcher</text>
  <text x="350.0" y="165.0" text-anchor="middle" class="box-s">1 domain -&gt; 1 thread delay</text>
  <line x1="440" y1="151" x2="483" y2="151" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="483" y="110" width="185" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="575.5" y="147.0" text-anchor="middle" class="box-t">Content Parser &amp; Dedup</text>
  <text x="575.5" y="165.0" text-anchor="middle" class="box-s">SimHash / Bloom Filter check</text>
  <line x1="668" y1="151" x2="711" y2="151" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="711" y="110" width="157" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="789.5" y="147.0" text-anchor="middle" class="box-t">Page Store + Links</text>
  <text x="789.5" y="165.0" text-anchor="middle" class="box-s">WARC / S3 + new URLs</text>
  <line x1="790" y1="192" x2="790" y2="268" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="230" y="240" width="560" height="62" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="510.0" y="276.0" text-anchor="middle" class="box-t">URL Seen? -&gt; Bloom Filter O(1) Memory Check -&gt; Enqueue Only Unseen URLs</text>
  <line x1="230" y1="271" x2="125" y2="271" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <line x1="125" y1="271" x2="125" y2="192" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="125.0" y="224.5" text-anchor="middle" class="lbl">Loop</text>
</svg>