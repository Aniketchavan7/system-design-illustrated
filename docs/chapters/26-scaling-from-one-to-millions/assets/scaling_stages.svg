<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Scaling Architecture Evolution (1 to 10M+ Users)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Scaling Architecture Evolution (1 to 10M+ Users)</text>
  <text x="32" y="58" class="sub">Moving bottlenecks off single nodes into cached, sharded, geo-replicated tiers</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="100" width="170" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="117.0" y="137.0" text-anchor="middle" class="box-t">Stage 1 · 1k Users</text>
  <text x="117.0" y="155.0" text-anchor="middle" class="box-s">Single App + DB Box</text>
  <line x1="202" y1="141" x2="244" y2="141" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="223.0" y="134.0" text-anchor="middle" class="lbl">Separate</text>
  <rect x="244" y="100" width="185" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="336.5" y="137.0" text-anchor="middle" class="box-t">Stage 2 · 100k</text>
  <text x="336.5" y="155.0" text-anchor="middle" class="box-s">LB + Read Replicas</text>
  <line x1="429" y1="141" x2="471" y2="141" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="450.0" y="134.0" text-anchor="middle" class="lbl">Offload</text>
  <rect x="471" y="100" width="185" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="563.5" y="137.0" text-anchor="middle" class="box-t">Stage 3 · 1M</text>
  <text x="563.5" y="155.0" text-anchor="middle" class="box-s">CDN + Redis Cache</text>
  <line x1="656" y1="141" x2="698" y2="141" stroke="#1d4ed8" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <text x="677.0" y="134.0" text-anchor="middle" class="lbl">Shard</text>
  <rect x="698" y="100" width="170" height="82" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="783.0" y="137.0" text-anchor="middle" class="white-t">Stage 4 · 10M+</text>
  <text x="783.0" y="155.0" text-anchor="middle" class="white-s">Multi-Region Shards</text>
  <rect x="32" y="230" width="260" height="120" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="162.0" y="286.0" text-anchor="middle" class="box-t">Edge &amp; Cache Shield</text>
  <text x="162.0" y="304.0" text-anchor="middle" class="box-s">Static assets served at CDN (&lt;20ms); 80/20 hot reads hit RAM (&lt;1ms)</text>
  <rect x="320" y="230" width="260" height="120" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="450.0" y="286.0" text-anchor="middle" class="box-t">Stateless Compute Tier</text>
  <text x="450.0" y="304.0" text-anchor="middle" class="box-s">Sessions externalized to Redis; Auto-scaling behind L7 Load Balancers</text>
  <rect x="608" y="230" width="260" height="120" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="738.0" y="286.0" text-anchor="middle" class="box-t">Partitioned &amp; Async Data</text>
  <text x="738.0" y="304.0" text-anchor="middle" class="box-s">Sharded DBs + Kafka queues absorb spikes without cascading failure</text>
</svg>