<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Real-Time Ad Click Aggregation (Flink Exactly-Once Pipeline)">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Real-Time Ad Click Aggregation (Flink Exactly-Once Pipeline)</text>
  <text x="32" y="58" class="sub">Counting millions of ad clicks per minute with event-time watermarks &amp; fraud filtering</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="100" width="180" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="122.0" y="137.0" text-anchor="middle" class="box-t">Ad Click Events</text>
  <text x="122.0" y="155.0" text-anchor="middle" class="box-s">Partitioned by ad_id</text>
  <line x1="212" y1="141" x2="255" y2="141" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="255" y="100" width="190" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="350.0" y="137.0" text-anchor="middle" class="box-t">Kafka Log</text>
  <text x="350.0" y="155.0" text-anchor="middle" class="box-s">Replayable offset state</text>
  <line x1="445" y1="141" x2="488" y2="141" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="466.5" y="134.0" text-anchor="middle" class="lbl">Flink</text>
  <rect x="488" y="100" width="210" height="82" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="593.0" y="137.0" text-anchor="middle" class="white-t">10s Tumbling Window</text>
  <text x="593.0" y="155.0" text-anchor="middle" class="white-s">Watermark + Dedup filter</text>
  <line x1="698" y1="141" x2="738" y2="141" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="738" y="100" width="130" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="803.0" y="137.0" text-anchor="middle" class="box-t">OLAP Sink</text>
  <text x="803.0" y="155.0" text-anchor="middle" class="box-s">ClickHouse/Pinot</text>
  <rect x="32" y="235" width="405" height="105" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="234.5" y="283.5" text-anchor="middle" class="box-t">Event Time vs. Processing Time</text>
  <text x="234.5" y="301.5" text-anchor="middle" class="box-s">Watermarks wait bounded slack (e.g. 5s) for delayed mobile clicks before closing windows</text>
  <rect x="463" y="235" width="405" height="105" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="665.5" y="283.5" text-anchor="middle" class="box-t">Lambda/Kappa Reconciliation</text>
  <text x="665.5" y="301.5" text-anchor="middle" class="box-s">Checkpointed RocksDB state + idempotent DB upserts avoid double billing advertisers</text>
</svg>