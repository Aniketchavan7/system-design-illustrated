services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: orders
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: lab
    volumes:
      - orders:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-orders.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "lab", "-d", "orders"]
      interval: 2s
      timeout: 5s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.1-alpine
    environment:
      RABBITMQ_DEFAULT_USER: lab
      RABBITMQ_DEFAULT_PASS: lab
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 3s
      timeout: 5s
      retries: 30
  lab:
    build: .
    environment:
      DATABASE_URL: postgresql://lab:lab@postgres:5432/orders
      AMQP_URL: amqp://lab:lab@rabbitmq:5672/%2f
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  orders:
