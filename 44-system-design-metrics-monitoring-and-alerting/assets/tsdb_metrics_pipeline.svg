<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Metrics Collection, Gorilla TSDB Compression &amp; Alerting">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Metrics Collection, Gorilla TSDB Compression &amp; Alerting</text>
  <text x="32" y="58" class="sub">Ingesting 10M+ time-series samples/sec with 12x compression and automated alerts</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="100" width="195" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="129.5" y="137.0" text-anchor="middle" class="box-t">Servers &amp; Sidecars</text>
  <text x="129.5" y="155.0" text-anchor="middle" class="box-s">/metrics scrape or Push agent</text>
  <line x1="227" y1="141" x2="275" y2="141" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="251.0" y="134.0" text-anchor="middle" class="lbl">Batch</text>
  <rect x="275" y="100" width="280" height="82" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="415.0" y="137.0" text-anchor="middle" class="white-t">Time-Series DB (TSDB)</text>
  <text x="415.0" y="155.0" text-anchor="middle" class="white-s">RAM Write Buffer + Gorilla 1.37B/pt</text>
  <line x1="555" y1="141" x2="603" y2="141" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="579.0" y="134.0" text-anchor="middle" class="lbl">Rollups</text>
  <rect x="603" y="100" width="265" height="82" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="735.5" y="137.0" text-anchor="middle" class="box-t">Alert Evaluator &amp; Dashboards</text>
  <text x="735.5" y="155.0" text-anchor="middle" class="box-s">Downsample 1m -&gt; 5m -&gt; 1h</text>
  <rect x="32" y="235" width="400" height="105" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="232.0" y="283.5" text-anchor="middle" class="box-t">Delta-of-Delta &amp; XOR Encoding</text>
  <text x="232.0" y="301.5" text-anchor="middle" class="box-s">Compresses 16-byte timestamps + float64 metrics down to ~1.37 bytes/sample in RAM</text>
  <rect x="460" y="235" width="408" height="105" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="664.0" y="283.5" text-anchor="middle" class="box-t">Cardinality Guardrail</text>
  <text x="664.0" y="301.5" text-anchor="middle" class="box-s">Never use unbounded user_id/UUID in metric labels—causes OOM index explosion</text>
</svg>