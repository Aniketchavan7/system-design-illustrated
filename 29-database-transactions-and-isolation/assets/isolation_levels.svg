<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="SQL Isolation Spectrum &amp; Concurrency Anomalies">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">SQL Isolation Spectrum &amp; Concurrency Anomalies</text>
  <text x="32" y="58" class="sub">Balancing strict serializability against lock contention and snapshot overhead</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="100" width="190" height="74" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="127.0" y="133.0" text-anchor="middle" class="box-t">Read Uncommitted</text>
  <text x="127.0" y="151.0" text-anchor="middle" class="box-s">Allows dirty reads</text>
  <line x1="222" y1="137" x2="254" y2="137" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="254" y="100" width="190" height="74" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="349.0" y="133.0" text-anchor="middle" class="box-t">Read Committed</text>
  <text x="349.0" y="151.0" text-anchor="middle" class="box-s">No dirty reads (PG default)</text>
  <line x1="444" y1="137" x2="476" y2="137" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <rect x="476" y="100" width="190" height="74" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="571.0" y="133.0" text-anchor="middle" class="box-t">Repeatable Read</text>
  <text x="571.0" y="151.0" text-anchor="middle" class="box-s">Snapshot reads (MySQL)</text>
  <line x1="666" y1="137" x2="698" y2="137" stroke="#1d4ed8" stroke-width="1.75" marker-end="url(#arrow-blue)"/>
  <rect x="698" y="100" width="170" height="74" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="783.0" y="133.0" text-anchor="middle" class="white-t">Serializable</text>
  <text x="783.0" y="151.0" text-anchor="middle" class="white-s">Zero anomalies (SSI/2PL)</text>
  <rect x="32" y="220" width="260" height="130" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="162.0" y="281.0" text-anchor="middle" class="box-t">MVCC Snapshot Versions</text>
  <text x="162.0" y="299.0" text-anchor="middle" class="box-s">Readers never block writers; each tx sees committed tuple version &lt;= start_ts</text>
  <rect x="320" y="220" width="260" height="130" rx="6" fill="#fef3c7" stroke="#b45309" stroke-width="1.5"/>
  <text x="450.0" y="281.0" text-anchor="middle" class="box-t">Write Skew Risk</text>
  <text x="450.0" y="299.0" text-anchor="middle" class="box-s">Repeatable Read still permits two txs checking overlapping sets concurrently</text>
  <rect x="608" y="220" width="260" height="130" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="738.0" y="281.0" text-anchor="middle" class="box-t">Spanner / Cockroach SSI</text>
  <text x="738.0" y="299.0" text-anchor="middle" class="box-s">Serializable Snapshot Isolation detects rw-antidependencies</text>
</svg>