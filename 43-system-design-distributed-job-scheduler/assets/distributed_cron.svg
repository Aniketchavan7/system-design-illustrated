<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Distributed Job Scheduler &amp; Fault-Tolerant Lease Locks">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Distributed Job Scheduler &amp; Fault-Tolerant Lease Locks</text>
  <text x="32" y="58" class="sub">Firing 100k+ cron jobs/sec exactly-once via sharded triggers &amp; worker heartbeats</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="105" width="185" height="80" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="124.5" y="141.0" text-anchor="middle" class="box-t">Sharded Job DB</text>
  <text x="124.5" y="159.0" text-anchor="middle" class="box-s">Partitioned by next_run_at</text>
  <line x1="217" y1="145" x2="265" y2="145" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="241.0" y="138.0" text-anchor="middle" class="lbl">Poll window</text>
  <rect x="265" y="105" width="195" height="80" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="362.5" y="141.0" text-anchor="middle" class="white-t">Scheduler Coordinators</text>
  <text x="362.5" y="159.0" text-anchor="middle" class="white-s">Acquires Lease Lock (30s TTL)</text>
  <line x1="460" y1="145" x2="508" y2="145" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="484.0" y="138.0" text-anchor="middle" class="lbl">Kafka</text>
  <rect x="508" y="105" width="175" height="80" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="595.5" y="141.0" text-anchor="middle" class="box-t">Ready Queue</text>
  <text x="595.5" y="159.0" text-anchor="middle" class="box-s">Buffered by Priority</text>
  <line x1="683" y1="145" x2="725" y2="145" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="704.0" y="138.0" text-anchor="middle" class="lbl">Execute</text>
  <rect x="725" y="105" width="143" height="80" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="796.5" y="141.0" text-anchor="middle" class="box-t">Worker Pool</text>
  <text x="796.5" y="159.0" text-anchor="middle" class="box-s">Heartbeat q5s</text>
  <rect x="32" y="235" width="836" height="105" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="450.0" y="283.5" text-anchor="middle" class="box-t">Crash &amp; Zombie Prevention</text>
  <text x="450.0" y="301.5" text-anchor="middle" class="box-s">If Worker dies mid-job, heartbeat stops -&gt; Lease expires after 30s -&gt; New Worker retries idempotent job_id</text>
</svg>