name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main, "codex/**" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12"]
        include:
          - os: windows-latest
            python-version: "3.11"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 📦 Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: 🔍 Compile Python bytecode (Syntax check)
        run: |
          python -m compileall -q -f .

      - name: 🧪 Run Pytest test suite
        run: |
          python -m pytest -v --tb=short

      - name: 📊 Generate CI Job Summary
        if: always()
        shell: bash
        run: |
          echo "### 🧠 System Design Illustrated — Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version**: \`${{ matrix.python-version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **OS**: \`${{ runner.os }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status == 'success' && '✅ Passed' || '❌ Failed' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Verified Components**:" >> $GITHUB_STEP_SUMMARY
          echo "  - 45 Runnable Module \`demo.py\` scripts" >> $GITHUB_STEP_SUMMARY
          echo "  - \`calculate.py\` Capacity Planning Calculator" >> $GITHUB_STEP_SUMMARY
          echo "  - Module directory structure and relative markdown links" >> $GITHUB_STEP_SUMMARY
          echo "  - Flashcard Web App dataset (\`cards-data.js\`) and DOM bindings" >> $GITHUB_STEP_SUMMARY

  lint-and-validate:
    name: Asset & Link Integrity
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest -r course/requirements.txt

      - name: 🗂️ Verify root and docs/ parity
        run: |
          cmp app.css docs/app.css
          cmp app.js docs/app.js
          cmp cards-data.js docs/cards-data.js

      - name: 🔗 Verify relative links and module integrity
        run: |
          pytest -v tests/test_structure_and_links.py tests/test_flashcard_app.py

      - name: Verify generated course content
        run: python course/build.py --check

  course-browser:
    name: Course browser smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install course browser dependencies
        run: |
          python -m pip install -r course/requirements-browser.txt
          python -m playwright install --with-deps chromium
      - name: Verify course navigation, saved progress, and simulator
        run: python course/browser_smoke.py
      - name: Upload static pull request preview
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: trail-notes-pages-preview
          path: docs/

  order-processing-lab:
    name: Order processing crash recovery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: labs/order-processing
    steps:
      - uses: actions/checkout@v4
      - name: Start PostgreSQL and RabbitMQ
        run: docker compose up -d --wait --wait-timeout 120 postgres rabbitmq
      - name: Verify relay and worker crash recovery
        run: docker compose run --rm --build lab verify
      - name: Stop lab services
        if: always()
        run: docker compose down
