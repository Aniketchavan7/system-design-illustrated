<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="$description">
  <title>$title | System Design Illustrated</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Radio+Canada+Big:wght@700&family=Radio+Canada:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../course/course.css">
  <script src="../course/progress.js" defer></script>
</head>
<body data-course-page="lesson" data-lesson-id="$id">
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header container">
    <a class="wordmark" href="../" aria-label="System Design Illustrated home">System Design <span>Illustrated</span></a>
    <nav aria-label="Main navigation">
      <a href="../#lessons">Lessons</a>
      <a href="simulator.html">Simulator</a>
      <a href="../flashcards.html">Flashcards</a>
    </nav>
  </header>
  <main id="main" class="lesson-layout container">
    <article class="lesson-body">
      <header class="lesson-header">
        <p class="lesson-position">Lesson $number of $total</p>
        <h1>$title</h1>
      </header>
      $content
      $resources
      <footer class="lesson-footer">
        <div class="lesson-navigation">
          <button class="button" type="button" data-complete data-requires-progress hidden>Mark complete</button>
          <a class="text-link" href="$next_url">$next_label</a>
        </div>
        $progress_controls
$previous
      </footer>
    </article>
    <nav class="lesson-sidebar" aria-label="Trail Notes lessons">
      <h2>Trail Notes</h2>
      $outline
    </nav>
  </main>
  <footer class="course-footer container">
    <a href="../#lessons">All lessons</a>
    <a href="https://github.com/Aniketchavan7/system-design-illustrated">Source on GitHub</a>
  </footer>
</body>
</html>
