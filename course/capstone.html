<main id="main" class="capstone container">
    <header class="practice-header">
      <h1>Trail Notes capstone</h1>
      <p class="lead">Apply the six lessons to a new workload, then check your reasoning.</p>
    </header>
$capstone_history
    <noscript><p>Choose your answers on paper, then open each explanation. Enable JavaScript for automatic scoring.</p></noscript>
    <form data-capstone>
      <div id="questions">
$questions
      </div>
      <div class="capstone-actions" data-capstone-actions hidden>
        <button class="button" type="submit">Check answers</button>
        <button class="text-link" type="reset">Try again</button>
      </div>
      <p class="capstone-result" data-capstone-result role="status" tabindex="-1" hidden></p>
    </form>
$progress_controls
  </main>
