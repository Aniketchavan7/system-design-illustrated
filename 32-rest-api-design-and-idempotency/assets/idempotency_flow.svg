<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="100%" role="img" aria-label="Idempotent Payment API Request State Machine">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#18181b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#1d4ed8"/>
    </marker>
    <style>
      .title { font: 700 20px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .sub { font: 400 13px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .box-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #18181b; }
      .box-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .mono { font: 600 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; fill: #1d4ed8; }
      .lbl { font: 600 11px system-ui, -apple-system, sans-serif; fill: #52525b; }
      .white-t { font: 700 13.5px system-ui, -apple-system, sans-serif; fill: #ffffff; }
      .white-s { font: 400 11.5px system-ui, -apple-system, sans-serif; fill: #dbeafe; }
    </style>
  </defs>
  <rect x="1" y="1" width="898" height="398" rx="12" fill="#faf9f5" stroke="#d4d4d8" stroke-width="1.5"/>
  <text x="32" y="38" class="title">Idempotent Payment API Request State Machine</text>
  <text x="32" y="58" class="sub">Preventing double charges across network timeouts using Idempotency-Key + atomic locks</text>
  <line x1="32" y1="72" x2="868" y2="72" stroke="#e4e4e7" stroke-width="1"/>
  <rect x="32" y="130" width="150" height="74" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="107.0" y="163.0" text-anchor="middle" class="box-t">Client Retry</text>
  <text x="107.0" y="181.0" text-anchor="middle" class="box-s">Idempotency-Key: k1</text>
  <line x1="182" y1="167" x2="238" y2="167" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="210.0" y="160.0" text-anchor="middle" class="lbl">POST</text>
  <rect x="238" y="130" width="195" height="74" rx="6" fill="#1d4ed8" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="335.5" y="163.0" text-anchor="middle" class="white-t">Gateway / Redis Lock</text>
  <text x="335.5" y="181.0" text-anchor="middle" class="white-s">SETNX k1 PROCESSING</text>
  <line x1="433" y1="150" x2="515" y2="112" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="470" y="116" text-anchor="middle" class="lbl">First request</text>
  <line x1="433" y1="184" x2="515" y2="222" stroke="#18181b" stroke-width="1.75" marker-end="url(#arrow)"/>
  <text x="470" y="220" text-anchor="middle" class="lbl">Duplicate retry</text>
  <rect x="515" y="84" width="350" height="62" rx="6" fill="#ffffff" stroke="#18181b" stroke-width="1.5"/>
  <text x="690.0" y="111.0" text-anchor="middle" class="box-t">Execute Payment + Commit Ledger</text>
  <text x="690.0" y="129.0" text-anchor="middle" class="box-s">Save HTTP 201 payload under key k1 (TTL 24h)</text>
  <rect x="515" y="192" width="350" height="62" rx="6" fill="#eff6ff" stroke="#1d4ed8" stroke-width="1.5"/>
  <text x="690.0" y="219.0" text-anchor="middle" class="box-t">Completed -&gt; Replay | In-Flight -&gt; 409</text>
  <text x="690.0" y="237.0" text-anchor="middle" class="box-s">Zero duplicate side-effects on upstream retry</text>
  <rect x="32" y="285" width="836" height="75" rx="6" fill="#ffffff" stroke="#52525b" stroke-width="1.5"/>
  <text x="450.0" y="318.5" text-anchor="middle" class="box-t">Cursor Pagination &amp; Versioning Invariant</text>
  <text x="450.0" y="336.5" text-anchor="middle" class="box-s">Use opaque cursor_id + /v1/ prefix + RFC 7807 error objects instead of OFFSET</text>
</svg>